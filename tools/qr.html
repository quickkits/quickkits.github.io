<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code Maker</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script type="module" crossorigin src="/js/tools-qr-DCDHOGI-.js"></script><link rel="modulepreload" crossorigin href="/js/modulepreload-polyfill-B5Qt9EMX.js"><link rel="stylesheet" crossorigin href="/css/tools-qr-DlsRaTY2.css"></head><body><main class="container"><h1 id="mainTitle">QR Code Maker</h1><p id="mainSubtitle" class="subtitle">Enter your message below to generate a shareable QR code.</p><section id="generatorSection"><label for="messageInput">Your Message</label> <textarea id="messageInput" placeholder="Type or paste your message here..." rows="5"></textarea> <button id="generateButton">Generate QR Code</button><div id="generatorOutput" class="section hidden"><h2>Scan to Share</h2><div id="qrcode-wrapper"><div id="qrcode"></div><div id="qrLoading" class="status hidden">Generating QR code...</div></div><div class="generated-url-container"><label for="generatedUrl">Shareable Link</label> <input id="generatedUrl" type="text" readonly="readonly"> <button id="copyUrlButton" class="secondary-button">Copy Link</button></div></div></section><section id="messageResult" class="section hidden"><h2>Decoded Message</h2><div id="decodedMessage" class="message-box"></div><button id="copyMessageButton">Copy Message</button><div id="copyStatus" class="status"></div></section><div id="globalStatus" class="status"></div></main></body></html>
